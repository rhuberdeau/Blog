services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: dev
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0 -p 3000"
    ports:
      # 3001 on the host so this can run beside other projects on 3000.
      - "${BLOG_PORT:-3001}:3000"
    environment:
      WEB_CONCURRENCY: "0"
      # System specs drive this browser; Capybara serves the app from the
      # test process and tells Chrome its container address.
      SELENIUM_URL: http://chrome:4444/wd/hub
    # Optional local settings, e.g. ANTHROPIC_API_KEY for the AI assistant
    # (gitignored; without it the assistant shows "not configured").
    env_file:
      - path: .env.development
        required: false
    volumes:
      - .:/app
      # Gems, tmp and the SQLite databases stay off the Windows bind mount:
      # native extensions are built for Linux, bind-mount I/O is slow, and
      # SQLite's file locking is unreliable across it.
      - bundle:/bundle
      - tmp:/app/tmp
      - storage:/app/storage
    depends_on:
      chrome:
        condition: service_started

  chrome:
    # Pinned: system specs should not change browser under you. Bump on purpose.
    image: selenium/standalone-chromium:152.0.7977.82
    shm_size: 2g

  # Runs Kamal: docker compose --profile deploy run --rm deploy bin/kamal deploy
  # Settings and secrets come from .env.deploy (gitignored; see
  # .env.deploy.example). The SSH key for the server is read from ~/.ssh.
  deploy:
    profiles: [deploy]
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: deploy
    env_file:
      - path: .env.deploy
        required: false
    volumes:
      - .:/app
      - bundle:/bundle
      - /var/run/docker.sock:/var/run/docker.sock
      - ${USERPROFILE:-~}/.ssh:/root/.ssh:ro

volumes:
  bundle:
  tmp:
  storage:
