services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0 -p 3000"
    ports:
      # 3001 on the host so this can run beside other projects on 3000.
      - "${BLOG_PORT:-3001}:3000"
    environment:
      WEB_CONCURRENCY: "0"
      # System specs drive this browser; Capybara serves the app from the
      # test process and tells Chrome its container address.
      SELENIUM_URL: http://chrome:4444/wd/hub
    volumes:
      - .:/app
      # Gems, tmp and the SQLite databases stay off the Windows bind mount:
      # native extensions are built for Linux, bind-mount I/O is slow, and
      # SQLite's file locking is unreliable across it.
      - bundle:/bundle
      - tmp:/app/tmp
      - storage:/app/storage
    depends_on:
      chrome:
        condition: service_started

  chrome:
    image: selenium/standalone-chromium:latest
    shm_size: 2g

volumes:
  bundle:
  tmp:
  storage:
